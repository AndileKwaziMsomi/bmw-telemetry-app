cat << 'EOF' > .github/workflows/docker-ci.yml
name: BMW Telemetry Docker CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Build the Docker image
      run: |
        docker build -t bmw-telemetry:ci .

    - name: Run container & verify health
      run: |
        docker run -d -p 5001:5000 --name ci-test-container bmw-telemetry:ci
        sleep 3
        curl -f http://localhost:5001/api/v1/telemetry
EOF