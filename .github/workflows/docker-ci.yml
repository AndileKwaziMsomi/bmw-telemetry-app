name: BMW Telemetry CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t bmw-telemetry-app .

      - name: Test Container Output
        run: |
          docker run -d -p 5001:5001 --name test-app bmw-telemetry-app
          sleep 3
          curl --fail http://localhost:5001/api/v1/telemetry